<style>

.ln{position:relative;min-height:1.6em;--ind:0px;--mk:0px;padding-left:calc(var(--ind) + var(--mk))}

.ln[data-done]{color:var(--sb);text-decoration:line-through}

    const st=l.dataset.size==='large'?' style="font-size:14px"':l.dataset.size==='small'?' style="font-size:11px"':'';
    const p=pre(l);
    return `<div class="preview-row${ind?' preview-indent':''}">${p?`<span class="preview-pre">${p}</span>`:''}<span class="preview-text${l.dataset.done!==undefined?' done':''}"${st}>${l.innerHTML}</span></div>`;
  };
  let out='<div class="card-preview">',i=0;
  while(i<lines.length){
    out+='<div class="preview-group">'+row(lines[i],false);i++;
    while(i<lines.length&&+(lines[i].dataset.indent||0)>0){out+=row(lines[i],true);i++}
    out+='</div>';
  }
  return out+'</div>';
}
function entryCard(e){
  const d=new Date(e.date+'T00:00:00');
  return `<div class="mcw" data-id="${e.id}">
    <div class="swipe-bg edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>편집</div>
    <div class="swipe-bg del">삭제<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></div>
    <div class="entry${e.pinned?' pinned':''}" style="--soft:${soft(MEMO_K[K][1])}">
      <div class="t">${e.pinned?PIN_SVG:''}<span>${esc2(e.title||'제목 없음')}</span><span class="d">${d.getMonth()+1}.${d.getDate()}</span></div>${previewHtml(e.html)}
    </div>
  </div>`;
}
function refreshList(){$body.innerHTML=listHtml()}
function togglePin(id){const e=L(K).find(x=>x.id===id);if(!e)return;e.pinned=!e.pinned;e.order=topOrder(e.pinned);save();refreshList()}

// ---------- 카드 제스처 ----------
// 짧게 탭: 열기 / 좌→우 스와이프: 편집 / 우→좌 스와이프: 삭제
// 길게 눌렀다 그대로 떼기: 고정·해제 / 길게 눌러서 위아래로 끌기: 순서 바꾸기
const G={};
function gStart(x,y,target){
  const cw=target.closest&&target.closest('.mcw');if(!cw||!$body.contains(cw))return false;
  Object.assign(G,{cw,card:cw.querySelector('.entry'),x0:x,y0:y,x,y,mode:null,timer:null});
  G.timer=setTimeout(()=>{if(G.mode===null){G.mode='hold';cw.classList.add('lifted');navigator.vibrate&&navigator.vibrate(12)}},430);
  return true;
}
function gMove(x,y){
  if(!G.cw)return false;
  G.x=x;G.y=y;const dx=x-G.x0,dy=y-G.y0;
  if(G.mode===null){
    if(Math.hypot(dx,dy)<9)return false;
    clearTimeout(G.timer);
    if(Math.abs(dx)>Math.abs(dy)*1.3){G.mode='swipe';G.cw.classList.add('swiping')}
    else{G.mode='scroll';return false}
  }
  if(G.mode==='scroll')return false;
  if(G.mode==='swipe'){
    let tx=dx;const lim=130;if(Math.abs(tx)>lim)tx=Math.sign(tx)*(lim+(Math.abs(tx)-lim)*.25);
    G.card.style.transform=`translateX(${tx}px)`;
    G.cw.querySelector('.swipe-bg.edit').style.opacity=tx>0?Math.min(1,tx/70):0;
    G.cw.querySelector('.swipe-bg.del').style.opacity=tx<0?Math.min(1,-tx/70):0;
    return true;
  }
  if(G.mode==='hold'&&Math.hypot(dx,dy)>6)dragBegin();
  if(G.mode==='drag'){dragMove(dy);return true}
  return true;
}
function gEnd(){
  if(!G.cw)return;
  clearTimeout(G.timer);
  const {cw,card,mode}=G,dx=G.x-G.x0;
  if(mode===null){G.cw=null;openNote(cw.dataset.id);return}
  if(mode==='hold'){cw.classList.remove('lifted');G.cw=null;togglePin(cw.dataset.id);return}
  if(mode==='swipe'){
    cw.classList.remove('swiping');
    card.style.transform='';cw.querySelectorAll('.swipe-bg').forEach(b=>b.style.opacity=0);
    G.cw=null;
    if(dx>80)setTimeout(()=>openNote(cw.dataset.id),150);
    else if(dx<-80){
      ask('이 메모를 삭제할까요?',{ok:'삭제',danger:true}).then(y=>{if(!y)return;
        card.style.transform='translateX(-110%)';cw.classList.add('removing');
        setTimeout(()=>{M()[K]=L(K).filter(x=>x.id!==cw.dataset.id);save();refreshList()},250);
      });
    }
    return;
  }
  if(mode==='drag'){dragEnd();return}
  G.cw=null;
}
// 끌어서 순서 바꾸기: 끄는 카드는 손가락을 따라오고, 다른 카드들이 비켜서며 자리가 벌어짐
function dragBegin(){
  G.mode='drag';
  G.list=G.cw.parentNode;G.sibs=[...G.list.children];
  G.from=G.sibs.indexOf(G.cw);G.to=G.from;
  G.rects=G.sibs.map(n=>n.getBoundingClientRect());
  G.step=G.rects[G.from].height+10;
  G.cw.classList.add('dragging');
}
function dragMove(dy){
  const minDy=G.rects[0].top-G.rects[G.from].top,maxDy=G.rects[G.rects.length-1].bottom-G.rects[G.from].bottom;
  dy=Math.max(minDy-20,Math.min(maxDy+20,dy));
  G.cw.style.transform=`translateY(${dy}px)`;
  const mid=G.rects[G.from].top+G.rects[G.from].height/2+dy;
  let to=G.from;
  G.rects.forEach((r,i)=>{if(i<G.from&&mid<r.top+r.height*.6)to=Math.min(to,i);if(i>G.from&&mid>r.top+r.height*.4)to=Math.max(to,i)});
  G.to=to;
  G.sibs.forEach((n,i)=>{
    if(n===G.cw)return;
    let s=0;
    if(G.from<to&&i>G.from&&i<=to)s=-G.step;
    if(G.from>to&&i<G.from&&i>=to)s=G.step;
    n.style.transform=s?`translateY(${s}px)`:'';
  });
}
function dragEnd(){
  const {cw,from,to,sibs,rects}=G;
  let target=0;
  if(to>from)target=rects[to].bottom-rects[from].bottom;
  if(to<from)target=rects[to].top-rects[from].top;
  cw.classList.remove('dragging');cw.classList.remove('lifted');
  cw.style.transform=`translateY(${target}px)`;
  G.cw=null;
  setTimeout(()=>{
    const ids=sibs.map(n=>n.dataset.id);ids.splice(to,0,ids.splice(from,1)[0]);
    ids.forEach((id,i)=>{const e=L(K).find(x=>x.id===id);if(e)e.order=i});
    save();refreshList();
  },to===from?200:260);
}
$body.addEventListener('touchstart',e=>{if(e.touches.length===1)gStart(e.touches[0].clientX,e.touches[0].clientY,e.target)},{passive:true});
$body.addEventListener('touchmove',e=>{if(G.cw&&gMove(e.touches[0].clientX,e.touches[0].clientY))e.preventDefault()},{passive:false});
$body.addEventListener('touchend',e=>{if(G.cw){if(G.mode!=='scroll')e.preventDefault();gEnd()}},{passive:false});
$body.addEventListener('touchcancel',()=>{if(G.cw){if(G.mode==='drag')dragEnd();else{G.cw.classList.remove('lifted','swiping');G.card.style.transform='';G.cw=null}clearTimeout(G.timer)}});
let mouseOn=false;
$body.addEventListener('mousedown',e=>{if('ontouchstart' in window&&e.sourceCapabilities?.firesTouchEvents)return;if(gStart(e.clientX,e.clientY,e.target)){mouseOn=true;e.preventDefault()}});
document.addEventListener('mousemove',e=>{if(mouseOn)gMove(e.clientX,e.clientY)});
document.addEventListener('mouseup',()=>{if(mouseOn){mouseOn=false;if(G.mode==='scroll'){G.cw=null;return}gEnd()}});

// ---------- 노트 편집기 ----------
const $note=document.getElementById('note'),$ed=document.getElementById('noteEd'),$nt=document.getElementById('noteTitle');
let noteId=null,noteDate='',notePinned=false,hist=[],lastSnapAt=0,savedRange=null;
const EMPTY_LINE='<div class="ln"><br></div>';
document.getElementById('notePin').onclick=()=>{notePinned=!notePinned;document.getElementById('notePin').classList.toggle('on',notePinned)};
document.getElementById('noteBack').onclick=()=>closeNote();
document.getElementById('noteDel').onclick=()=>deleteNote();
function openNote(id){
  const e=id?L(K).find(x=>x.id===id):null;
  noteId=e?e.id:null;
  setCat($note);
  document.getElementById('noteCat').textContent=MEMO_K[K][0];
  noteDate=e?e.date:tdy();
  document.getElementById('noteDate').textContent=fmtD(noteDate);
  document.getElementById('noteDel').style.display=e?'':'none';
  notePinned=!!(e&&e.pinned);document.getElementById('notePin').classList.toggle('on',notePinned);
  $nt.value=e?(e.title||''):'';
  $ed.innerHTML=e&&e.html?e.html:EMPTY_LINE;
  normalize();hist=[];after();
  $ed.scrollTop=0;
  $note.classList.add('open');
  if(!e)$nt.focus();
}
function closeNote(){
  normalize();
  const title=$nt.value.trim(),hasText=!!$ed.textContent.trim(),html=$ed.innerHTML;
  if(noteId){
    const e=L(K).find(x=>x.id===noteId);
    if(!title&&!hasText)M()[K]=L(K).filter(x=>x.id!==noteId);
    else{
      if(e.title!==title||e.html!==html){e.title=title;e.html=html;e.updated=Date.now()}
      if(!!e.pinned!==notePinned){e.pinned=notePinned;e.order=topOrder(notePinned)}
    }
  }else if(title||hasText){
    L(K).push({id:uid(),date:tdy(),title,html,updated:Date.now(),pinned:notePinned,order:topOrder(notePinned)});
  }
  save();
  if(document.activeElement)document.activeElement.blur();
  $note.classList.remove('open');
  refreshList();
}
async function deleteNote(){
  if(!noteId||!await ask('이 메모를 삭제할까요?',{ok:'삭제',danger:true}))return;
  M()[K]=L(K).filter(x=>x.id!==noteId);save();
  noteId=null;$nt.value='';$ed.innerHTML=EMPTY_LINE;
  $note.classList.remove('open');refreshList();
}
// 모든 줄이 <div class="ln"> 이 되도록 정리
function normalize(){
  if(!$ed.firstChild){$ed.innerHTML=EMPTY_LINE;return}
  [...$ed.childNodes].forEach(n=>{
    if(n.nodeType===1&&n.tagName==='DIV'){n.classList.add('ln');if(!n.firstChild)n.innerHTML='<br>';return}
    if(n.nodeType===3&&!n.textContent.length){n.remove();return}
    if(n.nodeType===1&&n.tagName==='BR'){const d=document.createElement('div');d.className='ln';d.innerHTML='<br>';n.replaceWith(d);return}
    const d=document.createElement('div');d.className='ln';$ed.insertBefore(d,n);d.appendChild(n);
  });
}
// 숫자 줄 번호 다시 매기기 (같은 들여쓰기끼리 이어서)
function reindex(){
  const cnt=[0,0,0,0];
  [...$ed.children].forEach(l=>{
    const i=+(l.dataset.indent||0);
    if(l.dataset.style==='number'){for(let k=i+1;k<4;k++)cnt[k]=0;cnt[i]++;l.dataset.n=cnt[i]+'.'}
    else{delete l.dataset.n;for(let k=i;k<4;k++)cnt[k]=0}
  });
}
function after(){
  reindex();
  $ed.classList.toggle('is-empty',$ed.children.length===1&&!$ed.textContent.length&&!$ed.firstChild.dataset.style);
  updateTb();
}
const lineOf=n=>{while(n&&n!==$ed){if(n.parentNode===$ed)return n;n=n.parentNode}return null};
function curRange(){
  const s=getSelection();
  if(s.rangeCount&&$ed.contains(s.getRangeAt(0).commonAncestorContainer))return s.getRangeAt(0);
  return savedRange;
}
function selLines(){
  const r=curRange();if(!r)return[];
  let a=r.startContainer===$ed?($ed.childNodes[r.startOffset]||$ed.lastChild):lineOf(r.startContainer);
  let b=r.endContainer===$ed?($ed.childNodes[Math.max(0,r.endOffset-1)]||$ed.lastChild):lineOf(r.endContainer);
  a=a||$ed.firstChild;b=b||a;
  const out=[];let n=a;while(n){out.push(n);if(n===b)break;n=n.nextElementSibling}
  return out;
}
function snapH(force){
  const now=Date.now();
  if(!force&&now-lastSnapAt<700)return;
  lastSnapAt=now;
  const h=$ed.innerHTML;if(hist[hist.length-1]!==h)hist.push(h);
  if(hist.length>80)hist.shift();
}
function caretToEnd(el){
  const r=document.createRange();r.selectNodeContents(el);r.collapse(false);
  const s=getSelection();s.removeAllRanges();s.addRange(r);
}
function updateTb(){
  const ls=selLines(),l=ls[0];
  document.querySelectorAll('#noteTb .tbtn').forEach(b=>{
    const a=b.dataset.act;let on=false;
    if(l&&['todo','bullet','dash','number'].includes(a))on=ls.every(x=>x.dataset.style===a);
    if(l&&a==='indent')on=+(l.dataset.indent||0)>0;
    if(l&&a==='bigger')on=l.dataset.size==='large';
    if(l&&a==='smaller')on=l.dataset.size==='small';
    if(a==='bold'||a==='underline'){try{on=!!curRange()&&document.queryCommandState(a)}catch(e){}}
    b.classList.toggle('on',on);
  });
}
document.addEventListener('selectionchange',()=>{
  const s=getSelection();
  if(s.rangeCount&&$ed.contains(s.getRangeAt(0).commonAncestorContainer)){savedRange=s.getRangeAt(0).cloneRange();updateTb()}
});
// 도구 모음: 누를 때 키보드/선택이 풀리지 않게
const $tb=document.getElementById('noteTb');
$tb.addEventListener('pointerdown',e=>{if(e.target.closest('.tbtn'))e.preventDefault()});
$tb.addEventListener('mousedown',e=>{if(e.target.closest('.tbtn'))e.preventDefault()});
$tb.addEventListener('click',e=>{
  const b=e.target.closest('.tbtn');if(!b)return;
  const act=b.dataset.act;
  if(act==='undo'){if(!hist.length)return;$ed.innerHTML=hist.pop();normalize();$ed.focus();caretToEnd($ed.lastChild);after();return}
  if(act==='erase'){if(!$ed.textContent.trim())return;ask('메모 내용을 모두 지울까요?',{ok:'지우기',danger:true}).then(y=>{if(!y)return;snapH(true);$ed.innerHTML=EMPTY_LINE;$ed.focus();caretToEnd($ed.firstChild);after()});return}
  if(act==='selectall'){$ed.focus();const r=document.createRange();r.selectNodeContents($ed);const s=getSelection();s.removeAllRanges();s.addRange(r);savedRange=r.cloneRange();updateTb();return}
  const r=curRange();
  if(r&&document.activeElement!==$ed){$ed.focus();const s=getSelection();s.removeAllRanges();s.addRange(r)}
  const ls=selLines();if(!ls.length)return;
  snapH(true);
  if(['todo','bullet','dash','number'].includes(act)){
    const all=ls.every(l=>l.dataset.style===act);
    ls.forEach(l=>{if(all)delete l.dataset.style;else l.dataset.style=act;if(all||act!=='todo')delete l.dataset.done});
  }
  if(act==='indent')ls.forEach(l=>{const c=+(l.dataset.indent||0);if(c<3)l.dataset.indent=c+1});
  if(act==='outdent')ls.forEach(l=>{const c=+(l.dataset.indent||0);if(c>1)l.dataset.indent=c-1;else delete l.dataset.indent});
  if(act==='bigger')ls.forEach(l=>{if(l.dataset.size==='small')delete l.dataset.size;else l.dataset.size='large'});
  if(act==='smaller')ls.forEach(l=>{if(l.dataset.size==='large')delete l.dataset.size;else l.dataset.size='small'});
  if(act==='bold'||act==='underline')document.execCommand(act);
  after();
});
function caretAtLineStart(l){
  const s=getSelection();if(!s.rangeCount||!s.isCollapsed)return false;
  const r=document.createRange();r.selectNodeContents(l);
  try{r.setEnd(s.anchorNode,s.anchorOffset)}catch(e){return false}
  return r.toString().length===0;
}
$ed.addEventListener('keydown',e=>{
  if(e.isComposing||e.keyCode===229)return;
  const s=getSelection(),l=s.rangeCount?lineOf(s.anchorNode):null;
  if(e.key==='Enter'&&l){
    if(l.dataset.style&&!l.textContent.trim()&&s.isCollapsed){
      e.preventDefault();snapH(true);
      if(+(l.dataset.indent||0)>0){const c=+l.dataset.indent;if(c>1)l.dataset.indent=c-1;else delete l.dataset.indent}
      else{delete l.dataset.style;delete l.dataset.done}
      after();return;
    }
    snapH(true);
    setTimeout(()=>{normalize();const n=lineOf(getSelection().anchorNode);if(n&&n!==l)delete n.dataset.done;after()},0);
    return;
  }
  if(e.key==='Backspace'&&l&&s.isCollapsed&&caretAtLineStart(l)){
    if(l.dataset.style){e.preventDefault();snapH(true);delete l.dataset.style;delete l.dataset.done;after();return}
    if(l.dataset.indent){e.preventDefault();snapH(true);const c=+l.dataset.indent;if(c>1)l.dataset.indent=c-1;else delete l.dataset.indent;after();return}
    if(l===$ed.firstElementChild){e.preventDefault();return}
  }
  if(e.key==='Tab'){e.preventDefault();snapH(true);selLines().forEach(x=>{const c=+(x.dataset.indent||0);if(e.shiftKey){if(c>1)x.dataset.indent=c-1;else delete x.dataset.indent}else if(c<3)x.dataset.indent=c+1});after()}
});
$ed.addEventListener('beforeinput',()=>snapH());
$ed.addEventListener('input',()=>{normalize();after()});
// 붙여넣기는 글자만
$ed.addEventListener('paste',e=>{
  e.preventDefault();snapH(true);
  const t=(e.clipboardData||window.clipboardData).getData('text/plain');
  document.execCommand('insertText',false,t);
});
// 체크 동그라미 누르면 완료 표시
function onMarker(e){
  const l=e.target.closest&&e.target.closest('.ln');
  if(!l||l.dataset.style!=='todo')return null;
  const ind=+(l.dataset.indent||0)*24,x=e.clientX-l.getBoundingClientRect().left;
  return (x>=ind-4&&x<=ind+26)?l:null;
}
$ed.addEventListener('pointerdown',e=>{if(onMarker(e))e.preventDefault()});
$ed.addEventListener('click',e=>{
  const l=onMarker(e);if(!l)return;
  e.preventDefault();snapH(true);
  if(l.dataset.done!==undefined)delete l.dataset.done;else l.dataset.done='';
  after();
});
// 제목에서 엔터 → 본문으로
$nt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();$ed.focus();caretToEnd($ed.firstChild)}});
// 각 탭 메모 버튼
document.addEventListener('click',e=>{const b=e.target.closest('[data-memo]');if(!b)return;openMemo(b.dataset.memo=='prop'?ptK:b.dataset.memo)});
})();
</script></body></html>
